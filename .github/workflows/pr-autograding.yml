name: PR Autotyper & Grader

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize ]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  grade-pr:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: pip install pytest graphviz gspread google-auth

    - name: Run PyTest and capture output
      id: run_tests
      continue-on-error: true
      env:
        PYTHONPATH: .
      run: |
        python -m pytest --tb=short > test_results.txt 2>&1
        cat test_results.txt

    - name: Parse Test Results and Branch Name
      if: always()
      id: parse_results
      env:
        BRANCH_NAME: ${{ github.head_ref }}
      run: |
        python - <<'EOF'
        import os
        import re

        with open("test_results.txt", "r") as f:
            content = f.read()

        # Extract passed/failed counts using regex from pytest summary
        passed_match = re.search(r'(\d+)\s+passed', content)
        failed_match = re.search(r'(\d+)\s+failed', content)

        passed = int(passed_match.group(1)) if passed_match else 0
        failed = int(failed_match.group(1)) if failed_match else 0
        total = passed + failed

        fraction_str = f"{passed}/{total}"

        if failed == 0 and total > 0:
            status_str = f"{fraction_str} PASSED 🟢"
        else:
            status_str = f"{fraction_str} PASSED 🔴"

        print(f"Calculated Score: {status_str}")

        with open(os.environ['GITHUB_ENV'], 'a') as env_file:
            env_file.write(f"TEST_SCORE_STR={status_str}\n")
            env_file.write(f"TEST_SCORE_FRACTION={fraction_str}\n")
        EOF

    - name: Log Grade to Google Sheets (Upsert & Override)
      if: always()
      env:
        GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        BRANCH_NAME: ${{ github.head_ref }}
        GITHUB_ACTOR_HANDLE: ${{ github.actor }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        SCORE_FRACTION: ${{ env.TEST_SCORE_FRACTION }}
      run: |
        python - <<'EOF'
        import os
        import json
        import gspread
        from google.oauth2.service_account import Credentials

        sa_creds_dict = json.loads(os.environ['GCP_SA_KEY'])
        scopes = [
            "https://www.googleapis.com/auth/spreadsheets",
            "https://www.googleapis.com/auth/drive"
        ]
        creds = Credentials.from_service_account_info(sa_creds_dict, scopes=scopes)
        client = gspread.authorize(creds)

        SPREADSHEET_ID = "1A6q_ElID_rQoUtatNz54LUwn4WnBpJlwVTG_u1tKclM"
        sheet = client.open_by_key(SPREADSHEET_ID).sheet1

        branch = os.environ['BRANCH_NAME']
        github_handle = os.environ['GITHUB_ACTOR_HANDLE']
        score = os.environ['SCORE_FRACTION']

        # Parse branch name format: name-with-hyphens_StudentID (e.g. seif-yasser-ahmed_21P0102)
        student_id = ""
        student_name = github_handle # fallback

        if branch and "_" in branch:
            parts = branch.rsplit("_", 1)
            raw_name = parts[0]
            student_id = parts[1].upper()
            student_name = " ".join([word.capitalize() for word in raw_name.split("-")])

        records = sheet.get_all_values()
        row_index = None

        # Check if student already exists by Student ID (Column 1) or GitHub Handle (Column 3)
        for idx, row in enumerate(records[1:], start=2):
            row_id = row[0].strip().upper() if len(row) > 0 else ""
            row_handle = row[2].strip().lower() if len(row) > 2 else ""
            
            if (student_id and row_id == student_id) or (row_handle == github_handle.lower()):
                row_index = idx
                break

        if row_index:
            # Overwrite existing row information and update Assignment 1 score (Column 4)
            sheet.update(range_name=f"A{row_index}:D{row_index}", values=[[student_id, student_name, github_handle, score]])
            print(f"Overrode existing row {row_index} for student ID: {student_id}")
        else:
            # Append new row matching columns: [Student ID, Student Name, GitHub Handle, Assignment 1 (MicroGrad)]
            new_row = [student_id, student_name, github_handle, score]
            sheet.append_row(new_row)
            print(f"Appended new entry for student ID: {student_id}")
        EOF

    - name: Comment on PR with Results
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const results = fs.readFileSync('test_results.txt', 'utf8');
          const score = process.env.TEST_SCORE_STR;
          
          const output = `### 🤖 Automated Grading Results
          **Score:** ${score}
          
          \`\`\`text
          ${results}
          \`\`\`
          `;
          
          github.rest.issues.createComment({
            issue_number: context.payload.pull_request.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: output
          })